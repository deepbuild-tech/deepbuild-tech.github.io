<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 580" role="img" aria-labelledby="title description">
  <title id="title">DeepBuild services and venture products</title>
  <desc id="description">DeepBuild applies domain knowledge, agentic systems, human oversight and integrations across two lines of work: tailored systems for businesses, including customer support and supply-chain workflows, and focused venture products for specialist domains. The CA-firm assistant is in development; Apnon, family health agents, is in exploration.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
    .eyebrow { fill: #b9b2dc; font-size: 13px; font-weight: 600; letter-spacing: 1.35px; }
    .title { fill: #ffffff; font-size: 29px; font-weight: 600; letter-spacing: -0.7px; }
    .shared { fill: #221660; }
    .shared-text { fill: #ffffff; font-size: 15px; font-weight: 500; }
    .card { fill: #160c40; stroke: #3a2f6e; stroke-width: 1.5; }
    .card-soft { fill: #221660; stroke: #3a2f6e; stroke-width: 1.2; }
    .heading { fill: #ffffff; font-size: 24px; font-weight: 600; letter-spacing: -0.45px; }
    .body { fill: #b9b2dc; font-size: 16px; font-weight: 400; }
    .small { fill: #b9b2dc; font-size: 14px; font-weight: 400; }
    .item-title { fill: #ffffff; font-size: 17px; font-weight: 600; }
    .status { fill: #b9b2dc; font-size: 13px; font-weight: 600; letter-spacing: 0.55px; }
    .connector { fill: none; stroke: #7a6fb0; stroke-width: 1.8; }
    .moving-connector { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-dasharray: 2 14; stroke-linecap: round; animation: flow 4s linear infinite; }
    .arrow { fill: none; stroke: #ffffff; stroke-width: 1.5; }
    @keyframes flow { to { stroke-dashoffset: -64; } }
    @media (prefers-reduced-motion: reduce) { .moving-connector { animation: none; } }
  </style>

  <text class="eyebrow" x="24" y="34">DEEPBUILD · TWO LINES OF WORK</text>
  <text class="title" x="24" y="80">One foundation. Services for businesses. Products for domains.</text>

  <rect class="shared" x="24" y="108" width="1182" height="74"/>
  <text class="eyebrow" x="48" y="137">A SHARED WAY OF BUILDING</text>
  <text class="shared-text" x="48" y="163">Domain work</text>
  <path class="connector" d="M178 157 H306"/>
  <path class="moving-connector" d="M178 157 H306"/>
  <path class="arrow" d="M298 151 L306 157 L298 163"/>
  <text class="shared-text" x="326" y="163">Agentic systems</text>
  <path class="connector" d="M472 157 H604"/>
  <path class="moving-connector" d="M472 157 H604"/>
  <path class="arrow" d="M596 151 L604 157 L596 163"/>
  <text class="shared-text" x="624" y="163">Human oversight</text>
  <path class="connector" d="M780 157 H906"/>
  <path class="moving-connector" d="M780 157 H906"/>
  <path class="arrow" d="M898 151 L906 157 L898 163"/>
  <text class="shared-text" x="926" y="163">Integrations &amp; operation</text>

  <rect class="card" x="24" y="210" width="570" height="348"/>
  <text class="eyebrow" x="52" y="246">01 · SERVICES FOR BUSINESSES</text>
  <text class="heading" x="52" y="285">Build, integrate and run</text>
  <text class="body" x="52" y="315">Systems shaped around each business's real work.</text>

  <rect class="card-soft" x="52" y="350" width="145" height="92"/>
  <text class="item-title" x="68" y="386">Understand</text>
  <text class="small" x="68" y="413">the workflow</text>
  <path class="connector" d="M197 396 H228"/>
  <path class="moving-connector" d="M197 396 H228"/>
  <path class="arrow" d="M220 390 L228 396 L220 402"/>

  <rect class="card-soft" x="228" y="350" width="168" height="92"/>
  <text class="item-title" x="244" y="386">Build &amp; connect</text>
  <text class="small" x="244" y="413">apps, agents, tools</text>
  <path class="connector" d="M396 396 H427"/>
  <path class="moving-connector" d="M396 396 H427"/>
  <path class="arrow" d="M419 390 L427 396 L419 402"/>

  <rect class="card-soft" x="427" y="350" width="139" height="92"/>
  <text class="item-title" x="443" y="386">Operate</text>
  <text class="small" x="443" y="413">and improve</text>
  <text class="small" x="52" y="484">Websites · apps · WhatsApp customer support</text>
  <text class="small" x="52" y="506">Lead generation · follow-up · marketing</text>
  <text class="small" x="52" y="528">Orders · inventory · supply-chain workflows</text>

  <rect class="card" x="636" y="210" width="570" height="348"/>
  <text class="eyebrow" x="664" y="246">02 · VENTURE PRODUCTS FOR DOMAINS</text>
  <text class="heading" x="664" y="285">Build focused products</text>
  <text class="body" x="664" y="315">Tools designed for specialist work and responsibilities.</text>

  <rect class="card-soft" x="664" y="350" width="514" height="78"/>
  <text class="eyebrow" x="684" y="376">FINANCE</text>
  <text class="item-title" x="684" y="405">CA-firm assistant</text>
  <text class="status" x="1148" y="405" text-anchor="end">IN DEVELOPMENT</text>

  <rect class="card-soft" x="664" y="442" width="514" height="78"/>
  <text class="eyebrow" x="684" y="468">HEALTHCARE</text>
  <text class="item-title" x="684" y="497">Apnon · family health agents</text>
  <text class="status" x="1148" y="497" text-anchor="end">IN EXPLORATION</text>

</svg>
